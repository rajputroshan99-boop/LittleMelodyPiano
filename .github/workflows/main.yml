{
"name": "Build Android APK",
"on": {
"push": {
"branches": ["main", "master"]
},
"workflow_dispatch": {}
},
"jobs": {
"build": {
"runs-on": "ubuntu-latest",
"steps": [
{
"name": "Checkout repository",
"uses": "actions/checkout@v4"
},
{
"name": "Set up JDK 17",
"uses": "actions/setup-java@v4",
"with": {
"java-version": "17",
"distribution": "temurin"
}
},
{
"name": "Setup Gradle",
"uses": "gradle/actions/setup-gradle@v4",
"with": {
"gradle-version": "8.11.1"
}
},
{
"name": "Build Debug APK",
"run": "for z in .zip; do if [ -f "$z" ]; then unzip -o "$z\"; fi; done\nPROJ_FILE=$(find . -name settings.gradle.kts \vert{} head -n 1)\nif [ -z "$PROJ_FILE\" ]; then\n  echo \"ERROR: Android project files not found! Files in repo:\"\n  ls -la\n  exit 1\nfi\nPROJ_DIR=$(dirname "$PROJ_FILE")\necho "Building project in: $PROJ_DIR"\ncd "$PROJ_DIR"\ngradle assembleDebug\ncp app/build/outputs/apk/debug/.apk "$GITHUB_WORKSPACE/LittleMelodyPiano.apk""
},
{
"name": "Upload APK",
"uses": "actions/upload-artifact@v4",
"with": {
"name": "LittleMelodyPiano-APK",
"path": "LittleMelodyPiano.apk"
}
}
]
}
}
}
