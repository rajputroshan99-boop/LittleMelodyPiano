name: Build Android APK
on:
push:
branches:
- main
- master
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  # 1. Download your repository files onto the build server
  - name: Checkout repository
    uses: actions/checkout@v4

  # 2. Install Java 17 (required by modern Android Gradle Plugin)
  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'

  # 3. Install Gradle directly so gradlew wrapper files are not required
  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.11.1'

  # 4. Locate the Android project folder (root or nested) and build the Debug APK
  - name: Build Debug APK
    run: |
      if [ -f "LittleMelodyPiano_Android/settings.gradle.kts" ]; then
        cd LittleMelodyPiano_Android
      fi
      gradle assembleDebug

  # 5. Save the compiled APK so you can download it from the Actions run page
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: LittleMelodyPiano-APK
      path: "**/app/build/outputs/apk/debug/*.apk"
